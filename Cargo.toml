[workspace]
resolver = "2"
members = [
    "crates/pipster",
    "crates/pipster-player",
    "crates/pipster-governor",
    "crates/pipster-image",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
[workspace.dependencies]
slint = { version = "1.19", default-features = false, features = ["backend-winit", "renderer-femtovg", "std", "compat-1-18", "unstable-winit-030"] }
slint-build = "1.19"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
directories = "6"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
