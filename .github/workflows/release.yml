name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0). Leave empty to use Cargo.toml version."
        required: false
        default: ""

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: Build macOS release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install mpv
        run: brew install mpv

      - name: Resolve version / tag
        id: ver
        run: |
          CARGO_VER="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v${CARGO_VER}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "arch=$(uname -m)" >> "$GITHUB_OUTPUT"

      - name: Package .app
        run: ./scripts/package_macos.sh
        env:
          PIPSTER_VERSION: ${{ steps.ver.outputs.version }}

      - name: Zip artifact
        run: |
          ARCH="${{ steps.ver.outputs.arch }}"
          cd dist
          ditto -c -k --keepParent Pipster.app "Pipster-macos-${ARCH}.zip"
          ditto -c -k --keepParent Pipster.app Pipster-macos.zip
          ls -lh *.zip

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Pipster ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            dist/Pipster-macos.zip
            dist/Pipster-macos-${{ steps.ver.outputs.arch }}.zip
          fail_on_unmatched_files: true
